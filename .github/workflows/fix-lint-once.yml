name: Fix lint blockers once

on:
  push:
    branches: [fix/league-navigation-audit]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/league-navigation-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              "src/lib/football/fotmob.ts": (
                  "const v = s.per90 ?? Number(s.statValue) ?? 0;",
                  "const v = s.per90 ?? Number(s.statValue);",
              ),
              "src/lib/football/odds-api.ts": (
                  "let next: MarketOdds = {",
                  "const next: MarketOdds = {",
              ),
          }
          changed = False
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new, 1))
                  changed = True
          if not changed:
              print("No lint replacements needed")
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/football/fotmob.ts src/lib/football/odds-api.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "lint: fix football module blockers"
          git push origin HEAD:fix/league-navigation-audit
