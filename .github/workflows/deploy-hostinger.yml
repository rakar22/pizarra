name: Deploy Pizarra to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Deployment handoff
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_DOMAIN: pizarra.utilix.cloud
        run: |
          if [ -z "$HOSTINGER_API_TOKEN" ]; then
            echo "HOSTINGER_API_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi
          echo "Build validated for $HOSTINGER_DOMAIN."
          echo "Hostinger deployment requires the account's Git auto-deployment connection to be configured in Hostinger."
          echo "The token is intentionally never printed or stored in the repository."
