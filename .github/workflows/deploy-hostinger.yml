name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-pizarra
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HOSTINGER_DOMAIN: pizarra.utilix.cloud
      HOSTINGER_USERNAME: u591947527
      NITRO_PRESET: node-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Football tests
        run: npm run test:football

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify Hostinger server output
        run: |
          test -f .output/server/index.mjs
          test -d .output/public

      - name: Package source archive
        run: |
          python3 - <<'PY'
          import os, zipfile
          skip_dirs = {".git", "node_modules", ".output", ".tanstack", ".nitro", "dist", "screenshots", "artifacts"}
          skip_files = {".env", ".env.local", "pizarra.zip"}
          with zipfile.ZipFile("pizarra.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk("."):
                  dirs[:] = [d for d in dirs if d not in skip_dirs and not d.startswith(".git")]
                  for name in files:
                      if name in skip_files or name.startswith(".env"):
                          continue
                      path = os.path.join(root, name)
                      z.write(path, os.path.relpath(path, "."))
          print("archive_bytes", os.path.getsize("pizarra.zip"))
          PY

      - name: Deploy to Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: node scripts/hostinger-deploy.mjs
