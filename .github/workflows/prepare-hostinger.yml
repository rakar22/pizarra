name: Prepare Pizarra for Hostinger

on:
  workflow_dispatch:
  push:
    branches: [fix/league-navigation-audit]

jobs:
  production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        env:
          NITRO_PRESET: node-server
        run: npm run build

      - name: Verify Hostinger server output
        run: |
          test -d .output
          test -f .output/server/index.mjs
          test -d .output/public
          echo "Hostinger package validated: .output/server/index.mjs + .output/public"

      - name: Verify obvious secret assignments are absent
        run: |
          if grep -RInE '(API_KEY|SECRET_KEY|PASSWORD|TOKEN)[[:space:]]*=' --exclude-dir=.git --exclude='*.lock' --exclude='*.yml' --exclude='*.yaml' .; then
            echo "Potential secret assignment found in repository files."
            exit 1
          fi
          echo "No obvious secret assignments detected in source files."
